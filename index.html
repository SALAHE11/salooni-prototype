<meta name="mobile-web-app-capable" content="yes">

@font-face{font-family:Manrope;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Manrope;src:url(fonts/manrope-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Manrope;src:url(fonts/manrope-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

:root{
  --ink:#0A2620;--bg:#F4F6F3;--surf:#FFFFFF;--acc:#F2632C;--accSoft:#FDE7DD;--mut:#4F5F58;--onDarkMut:#B9CBC2;
  --star:#B8441A;--starBg:#FBE6DC;--warn:#9A5B00;--warnBg:#FFF1D6;--info:#1F5F8B;--infoBg:#E3EEF6;
  --neu:#E8ECE8;--line:#DCE3DD;--danger:#A32D2D;--dangerBg:#FCEBEB;--ok:#1E6B47;--okBg:#E1F2E8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#D9E0DA;color:var(--ink)}
body{font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic",Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .08s}
button:active{transform:scale(.97)}
input{font:inherit}
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:500px) and (min-height:700px){.app{height:min(880px,96dvh);border-radius:32px;border:1px solid #C9D2CB}}
.top{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;background:var(--bg)}
.top h1{font-size:20px;font-weight:800;margin:0;flex:1;line-height:1.25}
html[lang=ar] .top h1{font-weight:700}
.top .sub{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--neu);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--okBg);color:var(--ok)}.chip.warn{background:var(--warnBg);color:var(--warn)}.chip.danger{background:var(--dangerBg);color:var(--danger)}
.lang{min-width:44px;justify-content:center}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;overscroll-behavior:contain}
.tabs{display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--mut);border-radius:12px}
.tabs button.on{color:var(--ink);background:var(--neu)}
.tabs svg{width:24px;height:24px}
.ico{width:20px;height:20px;flex:none}
.card{background:var(--surf);border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--line)}
.chair{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;margin-top:4px;display:flex;align-items:center;gap:12px}
.chair .k{font-size:12px;color:var(--onDarkMut);font-weight:500}
.chair .v{font-size:20px;font-weight:800;margin-top:2px}
html[lang=ar] .chair .v{font-weight:700}
.chair .t{font-size:12px;color:var(--onDarkMut);margin-top:2px}
.seat{width:44px;height:44px;border-radius:50%;border:3px solid #fff;flex:none;display:flex;align-items:center;justify-content:center}
.seat.busy{border-color:var(--acc)}.seat.busy::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin:16px 2px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 10px;margin-top:8px;min-height:56px;width:100%;text-align:start}
.num{width:28px;height:28px;border-radius:50%;background:var(--neu);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.nm{flex:1;min-width:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-walk,.t-call{background:var(--neu);color:var(--mut)}.t-app{background:var(--infoBg);color:var(--info)}.t-res{background:var(--starBg);color:var(--star)}
.starbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9AA8A0;flex:none}
.starbtn.on{color:var(--star);background:var(--starBg)}
.next{border:2px solid var(--warn);border-radius:16px;background:var(--surf);margin-top:8px;padding:2px 2px 10px}
.next .row{border:0;margin-top:0}
.next .lbl{font-size:12px;color:var(--warn);font-weight:700;padding:0 12px}
.three{display:flex;gap:6px;padding:6px 10px 0}
.three button{flex:1;min-height:48px;border-radius:12px;background:var(--neu);font-size:15px;font-weight:700}
.three button.warnb{background:var(--warnBg);color:var(--warn)}
.three button.act{background:var(--ink);color:#fff}
.waitnote{font-size:12px;color:var(--warn);padding:6px 12px 0;font-weight:600}
.bar{display:flex;gap:10px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line)}
.big{flex:1;min-height:60px;border-radius:16px;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
html[lang=ar] .big{font-weight:700}
.big small{font-size:12px;font-weight:600;opacity:1}
.big.outline{background:var(--surf);border:2px solid var(--ink)}
.big.accent{background:var(--acc);color:var(--ink)}
.big.dark{background:var(--ink);color:#fff}
.banner{border-radius:14px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.banner.warn{background:var(--warnBg);color:var(--warn)}.banner.danger{background:var(--dangerBg);color:var(--danger)}.banner.info{background:var(--infoBg);color:var(--info)}
.banner .grow{flex:1}
.banner button{background:var(--surf);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat div{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:30px;font-weight:800;margin-top:4px}
.stat span{font-size:13px;color:var(--mut);font-weight:600}
.h2{font-size:14px;font-weight:700;color:var(--mut);margin:20px 2px 0}
.list button,.list div.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-align:start}
.list .li:last-child,.list button:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--neu);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.av.dark{background:var(--ink);color:#fff}
.grow{flex:1;min-width:0}
.muted{color:var(--mut);font-size:13px;font-weight:500}
.seg{display:flex;background:var(--neu);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:14px}
.seg button.on{background:var(--surf);color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:800;font-size:16px;margin-top:10px}
html[lang=ar] .btn{font-weight:700}
.btn.accent{background:var(--acc);color:var(--ink)}.btn.dark{background:var(--ink);color:#fff}.btn.light{background:var(--neu)}
.btn.line{border:2px solid var(--line);background:var(--surf)}.btn.danger{border:2px solid var(--danger);color:var(--danger);background:var(--surf)}
.bcard .hd{display:flex;align-items:center;gap:12px}
.bcard .count{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.bcard .count b{font-size:34px;font-weight:800;line-height:1}
.bcard .est{font-size:14px;color:var(--mut);margin-top:4px;font-weight:600}
.bcard .est b{color:var(--ink)}
.resv{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{padding:10px 14px;border-radius:12px;background:var(--neu);font-weight:700;font-size:15px}
.chips button.on{background:var(--ink);color:#fff}
.chips button.off{background:var(--dangerBg);color:var(--danger);text-decoration:line-through}
.chips.hours button{min-width:72px;min-height:48px}
button.rule{width:100%;text-align:start;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center}
button.rule b{color:var(--ink);font-size:14px}
.tm{font-size:14px;font-weight:800;min-width:52px;text-align:center;background:var(--neu);border-radius:8px;padding:5px 6px;flex:none}
.pos .n.tmn{font-size:22px}
.next.req{border-color:var(--info)}.next.req .lbl{color:var(--info)}
.tiles.dim button{opacity:.4}
.pos{display:flex;align-items:center;gap:16px}
.pos .n{width:84px;height:84px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;flex:none}
.pos .n.acc{background:var(--acc);color:var(--ink)}
.line{margin-top:6px}
.line .li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;font-size:14px;font-weight:600}
.line .li.me{background:var(--accSoft)}
.rule{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:12px;font-weight:500;line-height:1.5}
.back{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:6px 0;color:var(--mut)}
html[dir=rtl] .flip{transform:scaleX(-1)}
.scrim{position:absolute;inset:0;background:rgba(10,38,32,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:var(--surf);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:88%;overflow-y:auto;animation:up .2s ease-out}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
html[lang=ar] .sheet h3{font-weight:700}
.sheet p{margin:4px 0 0;color:var(--mut);font-size:14px;line-height:1.55}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
.tiles{display:flex;gap:10px;margin-top:14px}
.tiles button{flex:1;min-height:96px;border-radius:18px;background:var(--neu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800}
html[lang=ar] .tiles button{font-weight:700}
.tiles svg{width:30px;height:30px}
.field{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:0 12px;margin-top:12px;background:var(--surf);color:var(--ink);font-size:16px}
.toast{position:absolute;inset-inline:16px;bottom:96px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;z-index:30;animation:up .2s ease-out}
.toast button{color:var(--acc);font-weight:800;padding:4px 6px}
.notif{position:absolute;top:calc(env(safe-area-inset-top) + 8px);inset-inline:10px;background:var(--surf);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 10px 30px rgba(10,38,32,.25);animation:down .25s ease-out;text-align:start}
.notif img{width:40px;height:40px;border-radius:10px}
.notif b{display:block;font-size:14px}.notif span{font-size:13px;color:var(--mut)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes down{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>

function ic(n,cls,fill){return `<svg class="${cls||'ico'}" viewBox="0 0 24 24" fill="${fill||'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`}

let S,ui={sheet:null,toast:null,notif:null,undo:null,resTime:null,resB:null,addTime:null};
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function roundUp(ts,step){const m=step*60000;return Math.ceil(ts/m)*m}
function blank(x){return Object.assign({barber:null,entry:null,alerted:false,req:null,msg:null,flash:null},x||{})}
function me(){return S.cl[S.me]}
function hb(){return S.barbers[MY_BARBER]}
function tsOf(time){const p=time.split(':');const d=new Date(Date.now());d.setHours(+p[0],+p[1],0,0);return d.getTime()}
// Demo data for Hamid, one example per working mode. The three demo clients start in three different situations.
function hamidSample(mode,len,now){
  if(mode==='appt'){const L=len*60000,o=dayAt(OPEN_H),g=o+Math.max(0,Math.ceil((now-o)/L))*L,mk=(i,x)=>Object.assign({ts:g+i*L,time:hhmm(g+i*L),len},x);
    return{queue:[mk(0,{id:11,src:'res',person:'youssef'}),mk(1,{id:12,src:'call',person:'omar'})],requests:[mk(3,{id:13,src:'res',person:'mehdi'})],
      cl:{anas:blank(),youssef:blank({barber:'hamid',entry:11}),mehdi:blank({req:{barber:'hamid',id:13,time:hhmm(g+3*L)}})}}}
  return{queue:[{id:1,src:'res',person:'youssef',time:hhmm(roundUp(now,5))},{id:2,src:'app',person:'hamza'},{id:3,src:'walk'},{id:4,src:'app',person:'mehdi'},{id:5,src:'call',person:'omar'}],requests:[],
    cl:{anas:blank(),youssef:blank({barber:'hamid',entry:1}),mehdi:blank({barber:'hamid',entry:4})}}}
function initial(lang,mode){
  const now=Date.now(),hs=hamidSample('queue',30,now),set=()=>({resOn:true,blocked:[],mode:'queue',slotLen:30,approve:false,requests:[]});
  return {v:3,lang:lang||'ar',mode:mode||'barber',btab:'file',ctab:'salons',cview:'list',nextId:100,me:'anas',
    barbers:{
      hamid:Object.assign(set(),{status:'open',pauseUntil:null,chair:null,chairSince:null,last:{src:'walk',person:'karim'},waitSince:null,queue:hs.queue}),
      yassine:Object.assign(set(),{status:'open',pauseUntil:null,chair:{id:6,src:'walk',person:'said'},chairSince:now-9*60000,last:{src:'walk',person:'bilal'},waitSince:null,queue:[{id:7,src:'walk'}]}),
      rachid:Object.assign(set(),{status:'pause',pauseUntil:roundUp(now+40*60000,30),chair:null,chairSince:null,last:null,waitSince:null,queue:[]})
    },
    stars:{'hamid:youssef':true},
    stats:{cuts:11,app:3,skips:1},
    cl:hs.cl
  };
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===3)return s}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();

function t(k,v){let s=(I18N[S.lang][k]||k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s.replace(/(\d[\d:]*)(\s?–\s?)(\d[\d:]*)/g,'<span dir="ltr">$1$2$3</span>')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pname(k){return PEOPLE[k]?PEOPLE[k][S.lang]:k}
function bname(k){return BARBERS[k][S.lang]}
function ename(e){if(!e)return'';if(e.person)return pname(e.person);if(e.name)return esc(e.name);return e.src==='call'?t('caller'):t('walkin')}
function stag(e,plain){const l=e.src==='res'?(plain?t('app'):t('res',{t:e.time})):t(e.src)+(e.time&&!plain?' · '+e.time:'');return `<span class="tag t-${e.src}">${l}</span>`}
function range(n){return{a:n*15,b:n*20}}
function isApp(e){return e.src==='app'||e.src==='res'}
function snapshot(){ui.undo=JSON.stringify(S)}
function checkTimers(){const now=Date.now();for(const k in S.barbers){const b=S.barbers[k];if(b.status==='pause'&&b.pauseUntil&&b.pauseUntil<=now){b.status='open';b.pauseUntil=null}}}
function myPos(){const m=me();if(!m.barber||!m.entry)return null;const b=S.barbers[m.barber];if(b.chair&&b.chair.id===m.entry)return{chair:true};const i=b.queue.findIndex(e=>e.id===m.entry);if(i<0)return null;return{index:i,ahead:i+(b.chair?1:0)}}
function checkAlert(){const p=myPos(),m=me();if(p&&!p.chair&&S.barbers[m.barber].mode!=='appt'&&p.ahead<=2&&p.ahead>0&&!m.alerted){m.alerted=true;m.alertPending=true}}

function render(){
  checkTimers();checkAlert();
  const html=document.documentElement;html.lang=S.lang;html.dir=S.lang==='ar'?'rtl':'ltr';
  const main=document.getElementById('main');const key=S.mode+S.btab+S.ctab+S.cview;const sc=main.dataset.k===key?main.scrollTop:0;
  let top='',body='',bar='',tabs='';
  if(S.mode==='barber'){
    const b=S.barbers[MY_BARBER],ap=b.mode==='appt';
    if(S.btab==='file'){top=topbar(t(ap?'myAppts':'myQueue')+' · '+bname(MY_BARBER),t('barberMode'),statusChip(b));body=barberQueue(b);bar=barberBar(b)}
    if(S.btab==='stats'){top=topbar(t('tabStats'),t('barberMode'));body=barberStats()}
    if(S.btab==='shop'){top=topbar(t('tabShop'),t('barberMode'));body=barberShop()}
    tabs=tab('btab','file','list',t(ap?'tabAppt':'tabFile'))+tab('btab','stats','chart',t('tabStats'))+tab('btab','shop','store',t('tabShop'));
  }else{
    const cm=t('clientMode')+' · '+pname(S.me);
    if(S.ctab==='salons'){if(S.cview==='shop'){top=topbar(t('shopName'),cm);body=shopPage()}else{top=topbar(t('mySalons'),cm);body=salonsList()}}
    if(S.ctab==='myq'){top=topbar(t('tabMyq'),cm);body=myQueue()}
    if(S.ctab==='profile'){top=topbar(t('profile'),cm);body=clientProfile()}
    tabs=tab('ctab','salons','home',t('tabSalons'))+tab('ctab','myq','ticket',t('tabMyq'))+tab('ctab','profile','user',t('tabProfile'));
  }
  document.getElementById('top').innerHTML=top;main.innerHTML=body;main.dataset.k=key;main.scrollTop=sc;
  document.getElementById('bar').innerHTML=bar;document.getElementById('tabs').innerHTML=tabs;
  renderLayer();save();
}
function topbar(title,sub,extra){return `<h1>${title}<span class="sub">${sub}</span></h1>${extra||''}<button class="chip lang" data-a="lang" aria-label="Langue / اللغة">${S.lang==='ar'?'FR':'ع'}</button>`}
function tab(group,id,icon,label){const on=S[group]===id;return `<button class="${on?'on':''}" data-a="tab" data-g="${group}" data-v="${id}">${ic(icon,'',null)}<span>${label}</span></button>`}
function statusChip(b){if(b.status==='pause')return `<button class="chip warn" data-a="qmenu">${ic('pause','ico')}${hhmm(b.pauseUntil)}</button>`;if(b.status==='closed')return `<button class="chip danger" data-a="qmenu">${ic('lock','ico')}${t('closed')}</button>`;return `<button class="chip ok" data-a="qmenu">${t('open')} ${ic('down','ico')}</button>`}

function reqBlock(b){
  if(!b.requests.length)return'';
  let h=`<div class="next req"><div class="lbl" style="padding-top:8px">${t('requests',{n:b.requests.length})}</div>`;
  b.requests.forEach(e=>{h+=`<div class="row"><span class="tm" dir="ltr">${e.time}</span><span class="nm">${ename(e)}</span></div><div class="three" style="padding-top:0"><button class="act" data-a="accept" data-id="${e.id}">${t('accept')}</button><button data-a="refuse" data-id="${e.id}">${t('refuse')}</button></div>`});
  return h+`</div>`}
function barberQueue(b){
  const ap=b.mode==='appt';let h='';
  if(b.status==='pause')h+=`<div class="banner warn">${ic('pause')}<span class="grow">${t('pauseBanner',{t:hhmm(b.pauseUntil)})}</span><button data-a="resume">${t('resume')}</button></div>`;
  if(b.status==='closed')h+=`<div class="banner danger">${ic('lock')}<span class="grow">${t('closedBanner')}</span><button data-a="reopen">${t('reopen')}</button></div>`;
  if(b.chair)h+=`<div class="chair"><div class="seat busy"></div><div class="grow"><div class="k">${t('inChair')}</div><div class="v">${ename(b.chair)}</div><div class="t">${t('since',{t:hhmm(b.chairSince)})}</div></div>${stag(b.chair)}</div>`;
  else h+=`<div class="chair"><div class="seat"></div><div class="grow"><div class="v">${t('chairFree')}</div><div class="t">${b.last?t('lastCut',{n:ename(b.last)}):t('noCutYet')}</div></div></div>`;
  h+=reqBlock(b);
  const n=b.queue.length,r=range(n+(b.chair?1:0));
  h+=`<div class="meta"><span>${ap?t('apptsN',{n}):t('waiting',{n})}</span><span>${n&&!ap?t('estimate',r):''}</span></div>`;
  if(!n)h+=`<div class="empty">${t(ap?'noAppt':'nobody')}</div>`;
  b.queue.forEach((e,i)=>{
    const st=S.stars[MY_BARBER+':'+e.person];
    const row=`<div class="row" ${i?'':'style="min-height:52px"'}>${ap?`<span class="tm" dir="ltr">${e.time}</span>`:`<span class="num">${i+1}</span>`}<button class="nm" data-a="rowmenu" data-id="${e.id}" style="text-align:start">${ename(e)}</button>${stag(e,ap)}${isApp(e)&&e.person?`<button class="starbtn ${st?'on':''}" data-a="star" data-id="${e.id}" aria-label="${t('star')}">${ic('star','ico',st?'currentColor':'none')}</button>`:''}</div>`;
    if(i===0){const w=b.waitSince?Math.max(0,Math.round((Date.now()-b.waitSince)/60000)):null;
      h+=`<div class="next"><div class="lbl" style="padding-top:8px">${t(ap?'nextUpAppt':'nextUp')}</div>${row}<div class="three"><button data-a="wait" class="${w!==null?'act':''}">${t('wait')}</button>${ap?'':`<button data-a="shift" class="warnb">${t('shift')}</button>`}<button data-a="skip">${t('skip')}</button></div>${w!==null?`<div class="waitnote">${t('waitingFor',{m:w})}</div>`:''}</div>`}
    else h+=row;

function resBlock(k,b,ap){

function dayAt(h){const d=new Date(Date.now());d.setHours(h,0,0,0);return d.getTime()}
function resList(b){return b.queue.filter(e=>e.src==='res')}
// Reservation rule: slots start after the current line would be done (20 min per person, at least 45 min),
// stop 30 min before closing, and skip the hours the barber blocked and the times already taken.
function resSlots(k){const b=S.barbers[k],n=b.queue.length+(b.chair?1:0),last=dayAt(CLOSE_H)-30*60000,taken={};
  resList(b).concat(b.requests,b.chair&&b.chair.src==='res'?[b.chair]:[]).forEach(e=>{taken[e.time]=1});
  const s=[];for(let ts=roundUp(Date.now()+Math.max(45,n*20)*60000,30);ts<=last&&s.length<4;ts+=30*60000){const hr=new Date(ts).getHours();if(hr<OPEN_H||b.blocked.indexOf(hr)>=0||taken[hhmm(ts)])continue;s.push(hhmm(ts))}
  return s}
// Rendez-vous mode: a grid of slots of the barber's chosen length, from opening to closing.
// A slot is free if it is at least 10 min away, touches no blocked hour and overlaps no booking or pending request.
function apptSlots(k,max){const b=S.barbers[k],L=b.slotLen*60000,min=Date.now()+10*60000,end=dayAt(CLOSE_H),busy=b.queue.concat(b.requests,b.chair?[b.chair]:[]).filter(e=>e.ts),out=[];
  for(let ts=dayAt(OPEN_H);ts+L<=end&&out.length<(max||8);ts+=L){if(ts<min)continue;
    let ok=true;for(let x=ts;x<ts+L;x+=30*60000)if(b.blocked.indexOf(new Date(x).getHours())>=0)ok=false;
    if(ok&&!busy.some(e=>ts<e.ts+e.len*60000&&e.ts<ts+L))out.push(hhmm(ts))}
  return out}
function placeEntry(b,e){if(b.mode==='appt'){let i=b.queue.findIndex(x=>x.ts>e.ts);if(i<0)i=b.queue.length;b.queue.splice(i,0,e)}else b.queue.push(e)}

  if(s.type==='join'){const k=s.b,bb=S.barbers[k];const tot=bb.queue.length+(bb.chair?1:0);const rs=resList(bb).map(e=>e.time);
    return `<h3>${t('joinQ',{n:bname(k)})}</h3><p style="font-weight:700;color:var(--ink)">${t('joinPos',{p:bb.queue.length+1,...range(tot)})}</p>${rs.length?`<div class="rule" style="font-size:14px;color:var(--star);font-weight:700">${ic('star','ico')}<span>${t(rs.length>1?'resAheadN':'resAhead1',{t:rs.join(' · ')})}</span></div>`:''}<div class="rule" style="font-size:14px">${ic('info','ico')}<span>${t('rule')}</span></div><button class="btn accent" data-a="join" data-b="${k}">${t('confirm')}</button><button class="btn light" data-a="closesheet">${t('cancel')}</button>`}
  if(s.type==='leave')return `<h3>${t('leaveQ')}</h3><p>${t('leaveInfo')}</p><button class="btn danger" data-a="leave">${t('leaveYes')}</button><button class="btn light" data-a="closesheet">${t('stay')}</button>`;
  if(s.type==='reset')return `<h3>${t('resetQ')}</h3><p>${t('resetInfo')}</p><button class="btn dark" data-a="reset">${t('reset')}</button><button class="btn light" data-a="closesheet">${t('cancel')}</button>`;
  return''}

let toastTimer,notifTimer;
function toast(msg,undo){ui.toast={msg,undo:!!undo};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast=null;renderLayer()},undo?5000:3000)}
function showNotif(title,msg){ui.notif={title,msg};clearTimeout(notifTimer);if(navigator.vibrate)try{navigator.vibrate(200)}catch(e){}notifTimer=setTimeout(()=>{ui.notif=null;renderLayer()},7000);renderLayer()}
function newId(){return ++S.nextId}

function ownerOf(id){for(const k in S.cl)if(S.cl[k].entry===id)return k;return null}
function release(e,x){const k=ownerOf(e.id);if(k)S.cl[k]=blank(x)}
function takeReq(d){const b=hb(),i=b.requests.findIndex(x=>x.id==d.id);if(i<0)return null;snapshot();return b.requests.splice(i,1)[0]}
const A={
 tab(d){S[d.g]=d.v;if(d.g==='ctab')S.cview='list';ui.resTime=null},
 lang(){S.lang=S.lang==='ar'?'fr':'ar'},
 setlang(d){S.lang=d.v},
 mode(){S.mode=S.mode==='barber'?'client':'barber';ui.sheet=null;ui.toast=null;ui.undo=null},
 qmenu(){ui.sheet={type:'qmenu'}},
 ressheet(){ui.sheet={type:'res'}},
 reson(d){hb().resOn=d.v==='1'},
 blockhour(d){const bl=hb().blocked,x=+d.v,i=bl.indexOf(x);if(i>=0)bl.splice(i,1);else bl.push(x)},
 closesheet(){ui.sheet=null},
 addsheet(){ui.addTime=null;ui.sheet={type:'add'}},
 pickadd(d){const f=document.getElementById('nameField');ui.sheet.name=f?f.value:'';ui.addTime=d.v},
 addwalk(){addEntry('walk')},addcall(){addEntry('call')},
 next(){const b=hb();if(!b.chair&&!b.queue.length){toast(t('nobody'));return}snapshot();
   if(b.chair){S.stats.cuts++;if(isApp(b.chair))S.stats.app++;b.last=b.chair;release(b.chair)}
   const nx=b.queue.shift();b.waitSince=null;
   if(nx){b.chair=nx;b.chairSince=Date.now();toast(t('served',{n:ename(nx)}),true)}else{b.chair=null;b.chairSince=null;toast(t('cutDone'),true)}},
 wait(){const b=hb();if(!b.queue.length)return;b.waitSince=b.waitSince?null:Date.now();if(b.waitSince)toast(t('waitingT',{n:ename(b.queue[0])}))},
 shift(){const b=hb();if(b.mode==='appt')return;if(b.queue.length<2){toast(t('cantShift'));return}snapshot();const e=b.queue.shift();b.queue.splice(Math.min(1,b.queue.length),0,e);b.waitSince=null;toast(t('shifted',{n:ename(e)}),true)},
 skip(){const b=hb();if(!b.queue.length)return;snapshot();const e=b.queue.shift();b.waitSince=null;S.stats.skips++;release(e,{msg:{k:'skippedMsg',n:MY_BARBER}});toast(t('skipped',{n:ename(e)}),true)},
 star(d){const b=hb();const e=b.queue.find(x=>x.id==d.id);if(!e||!e.person)return;const k=MY_BARBER+':'+e.person;if(S.stars[k]){delete S.stars[k];toast(t('unstarred',{n:ename(e)}))}else{S.stars[k]=true;toast(t('starred',{n:ename(e)}))}ui.sheet=null},
 rowmenu(d){ui.sheet={type:'row',id:+d.id}},
 remove(d){const b=hb();const i=b.queue.findIndex(x=>x.id==d.id);if(i<0)return;snapshot();const e=b.queue.splice(i,1)[0];if(i===0)b.waitSince=null;release(e,{msg:{k:e.src==='res'?'cancelledRes':'removedMsg',n:MY_BARBER,t:e.time}});ui.sheet=null;toast(t('removed',{n:ename(e)}),true)},
 accept(d){const e=takeReq(d);if(!e)return;placeEntry(hb(),e);const c=S.cl[e.person];if(c&&c.req&&c.req.id===e.id)S.cl[e.person]=blank({barber:MY_BARBER,entry:e.id,flash:{k:'reqAccepted',n:MY_BARBER,t:e.time}});toast(t('accepted',{n:ename(e),t:e.time}),true)},
 refuse(d){const e=takeReq(d);if(!e)return;const c=S.cl[e.person];if(c&&c.req&&c.req.id===e.id)S.cl[e.person]=blank({msg:{k:'refusedMsg',n:MY_BARBER,t:e.time},flash:{k:'reqRefused',n:MY_BARBER,t:e.time}});toast(t('refused',{n:ename(e)}),true)},
 setmode(d){const b=hb();if(b.mode===d.v)return;b.mode=d.v;const hs=hamidSample(d.v,b.slotLen,Date.now());b.queue=hs.queue;b.requests=hs.requests;b.chair=null;b.chairSince=null;b.waitSince=null;
   for(const k in hs.cl){const c=S.cl[k];if(!((c.barber&&c.barber!==MY_BARBER)||(c.req&&c.req.barber!==MY_BARBER)))S.cl[k]=hs.cl[k]}
   ui.undo=null;ui.resTime=null;toast(t('modeChanged'))},
 setlen(d){hb().slotLen=+d.v},
 setapprove(d){hb().approve=d.v==='1'},
 setme(d){S.me=d.v;ui.resTime=null;S.cview='list'},
 pause(d){const b=hb();b.status='pause';b.pauseUntil=roundUp(Date.now()+(+d.v)*60000,5);ui.sheet=null},
 resume(){const b=hb();b.status='open';b.pauseUntil=null;ui.sheet=null},
 close(){hb().status='closed';hb().pauseUntil=null;ui.sheet=null},
 reopen(){hb().status='open';ui.sheet=null},
 undo(){if(ui.undo){S=JSON.parse(ui.undo);ui.undo=null;ui.toast=null}},
 resetsheet(){ui.sheet={type:'reset'}},
 reset(){S=initial(S.lang,'barber');ui.sheet=null;ui.undo=null;ui.resTime=null;toast(t('resetDone'))},
 openshop(){S.cview='shop'},closeshop(){S.cview='list';ui.resTime=null},
 gomyq(){S.ctab='myq';S.cview='list'},gosalons(){const c=me();S.ctab='salons';S.cview=c.msg?'shop':'list';c.msg=null},
 joinsheet(d){ui.sheet={type:'join',b:d.b}},
 join(d){const b=S.barbers[d.b];if(b.status!=='open'||b.mode==='appt')return;const e={id:newId(),src:'app',person:S.me};b.queue.push(e);S.cl[S.me]=blank({barber:d.b,entry:e.id});ui.sheet=null;S.ctab='myq';S.cview='list';toast(t('joined',{n:bname(d.b)}))},
 pickres(d){ui.resTime=d.v;ui.resB=d.b},
 reserve(d){const k=d.b,b=S.barbers[k],ap=b.mode==='appt';if(!ui.resTime||ui.resB!==k)return;
   if(b.status!=='open'||!b.resOn||(ap?apptSlots(k,99):resSlots(k)).indexOf(ui.resTime)<0){ui.resTime=null;toast(t('slotGone'));return}
   const e={id:newId(),src:'res',person:S.me,time:ui.resTime};if(ap){e.ts=tsOf(e.time);e.len=b.slotLen}
   /* With approval (always in rendez-vous mode) the booking waits as a request. Otherwise it goes to the end of the line: it never passes anyone already waiting. */
   if(ap||b.approve){b.requests.push(e);S.cl[S.me]=blank({req:{barber:k,id:e.id,time:e.time}});toast(t('reqSent',{n:bname(k),t:e.time}))}
   else{b.queue.push(e);S.cl[S.me]=blank({barber:k,entry:e.id});toast(t('reserved',{t:e.time,n:bname(k)}))}
   ui.resTime=null;S.ctab='myq';S.cview='list'},
 cancelreq(){const c=me();if(c.req){const b=S.barbers[c.req.barber];b.requests=b.requests.filter(x=>x.id!==c.req.id)}S.cl[S.me]=blank();toast(t('reqCancelled'))},
 leavesheet(){ui.sheet={type:'leave'}},
 leave(){const m=me();if(m.barber){const b=S.barbers[m.barber];const i=b.queue.findIndex(x=>x.id===m.entry);if(i>=0){b.queue.splice(i,1);if(i===0)b.waitSince=null}}S.cl[S.me]=blank();ui.sheet=null;toast(t('left'))},
 notiftap(){ui.notif=null;if(S.mode==='client'){S.ctab='myq';S.cview='list'}}
};
function addEntry(src){const f=document.getElementById('nameField');const name=f&&f.value.trim()?f.value.trim().slice(0,30):null;const b=hb();
  if(b.mode==='appt'){if(!ui.addTime){ui.sheet.name=f?f.value:'';return}snapshot();const e={id:newId(),src,name,time:ui.addTime,ts:tsOf(ui.addTime),len:b.slotLen};placeEntry(b,e);ui.sheet=null;ui.addTime=null;toast(t('addedAt',{n:ename(e),t:e.time}),true);return}
  snapshot();const e={id:newId(),src,name};b.queue.push(e);ui.sheet=null;toast(t('added',{n:ename(e),p:b.queue.length}),true)}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');
  if(!el)return;
  if(el.dataset.a==='closesheet'&&ev.target.closest('[data-stop]')&&!ev.target.closest('button[data-a="closesheet"]'))return;
  const fn=A[el.dataset.a];if(!fn)return;
  fn(el.dataset);render();
});
setInterval(()=>{if(!ui.sheet)render()},30000);
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
